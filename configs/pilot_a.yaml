# Pilot run a (JGR revision): amplitude compression OFF: the model works on the anchor-normalised window as is.
# Settings on top of train.yaml; everything else is identical between pilot a and b:
#   python main.py fit --config configs/train.yaml --config configs/pilot_a.yaml
trainer:
  max_epochs: 3
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: "."
        name: "logs_pilot_a"
model:
  init_args:
    amp_compress: false
data:
  init_args:
    data_dir: /scratch/tmp/wesmail/ErUM-WAVE/SingleStation/SobolSamplingV2/pilot_train
